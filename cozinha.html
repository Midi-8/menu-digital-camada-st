<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozinha • Camada Santo Tirso</title>
  <meta name="description" content="Ecrã em tempo real da cozinha do Camada Santo Tirso.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/images/camada-logo.png">
  <style>
    .kitchen-header {
      background: #18191f;
      border-bottom: 1px solid #2b2e37;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
  </style>
</head>
<body class="kitchen-body">

  <!-- Cabeçalho Exclusivo da Cozinha -->
  <header class="kitchen-header">
    <div style="display:flex;align-items:center;gap:0.85rem">
      <img src="assets/images/camada-logo.png" alt="Camada" class="brand-logo-img">
      <div>
        <div style="font-weight:800;font-size:1.15rem;letter-spacing:-0.01em;color:#ffffff;text-transform:uppercase">
          Cozinha Camada
        </div>
        <div style="font-size:0.72rem;color:var(--camada-red);font-weight:700;letter-spacing:0.06em;text-transform:uppercase">
          Santo Tirso • Pedidos em tempo real
        </div>
      </div>
    </div>

    <!-- Ferramentas e Atalhos da Cozinha -->
    <div style="display:flex;align-items:center;gap:0.6rem">
      <button class="sound-toggle-btn active" id="soundToggleBtn">
        Som ativado
      </button>

      <button class="btn-secondary-sm" id="createTestOrderBtn" style="background:#2b2f3a;border-color:#3c4150;color:#fff">
        + Pedido teste
      </button>

      <button class="btn-secondary-sm" id="fullscreenToggleBtn" style="background:#2b2f3a;border-color:#3c4150;color:#fff">
        Ecrã inteiro
      </button>

      <a href="admin.html" class="btn-secondary-sm" style="text-decoration:none;background:#2b2f3a;border-color:#3c4150;color:#fff">
        Gestão
      </a>
    </div>
  </header>

  <main class="kds-container">

    <!-- Notificações de Chamadas de Mesa (Chamar Empregado / Conta) -->
    <div id="serviceAlertsContainer"></div>

    <!-- Barra de Métricas e Filtros da Cozinha -->
    <div class="kds-top-bar" style="margin-top:0.5rem">
      <div class="kds-stats-group">
        <div class="kds-stat-item">
          <span class="kds-stat-label">Pedidos a preparar</span>
          <span class="kds-stat-val" id="kdsTotalActive" style="color:var(--camada-red)">0</span>
        </div>
        <div class="kds-stat-item">
          <span class="kds-stat-label">Pendentes</span>
          <span class="kds-stat-val" id="kdsPendentesCount" style="color:#f59e0b">0</span>
        </div>
        <div class="kds-stat-item">
          <span class="kds-stat-label">No forno</span>
          <span class="kds-stat-val" id="kdsPreparandoCount" style="color:#fb923c">0</span>
        </div>
        <div class="kds-stat-item">
          <span class="kds-stat-label">Prontos</span>
          <span class="kds-stat-val" id="kdsProntosCount" style="color:var(--status-green)">0</span>
        </div>
      </div>

      <!-- Filtros Rápidos -->
      <div style="display:flex;gap:0.4rem;flex-wrap:wrap">
        <button class="category-pill active kds-filter-btn" data-filter="active">
          Ativos
        </button>
        <button class="category-pill kds-filter-btn" data-filter="pendente">
          Pendentes
        </button>
        <button class="category-pill kds-filter-btn" data-filter="preparando">
          No forno
        </button>
        <button class="category-pill kds-filter-btn" data-filter="pronto">
          Prontos
        </button>
        <button class="category-pill kds-filter-btn" data-filter="todos">
          Histórico
        </button>
      </div>
    </div>

    <!-- Grelha de Pedidos da Cozinha -->
    <div class="kds-grid" id="kdsOrdersGrid" style="margin-top:1.1rem"></div>

  </main>

  <!-- Scripts -->
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/kds.js"></script>

</body>
</html>
